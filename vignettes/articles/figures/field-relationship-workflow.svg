<svg xmlns="http://www.w3.org/2000/svg" width="970" height="145" viewBox="0 0 970 145" role="img" aria-labelledby="title description">
  <title id="title">From codebook to field relationship report</title>
  <desc id="description">Use a codebook of project definitions, select a field with field_relationship_summary(), then inspect relationships, interpretation issues, and inspection scope in the report.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="970" height="145" fill="white"/>
  <path d="M260 72 H315" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M635 72 H690" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172554">
    <rect x="10" y="20" width="250" height="105" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="135" y="62" font-size="22" font-weight="bold">Codebook</text>
    <text x="135" y="92" font-size="18">Project definitions</text>
    <rect x="315" y="20" width="320" height="105" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="475" y="62" font-size="22" font-weight="bold">Choose a field</text>
    <text x="475" y="92" font-size="18">field_relationship_summary()</text>
    <rect x="690" y="20" width="270" height="105" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
    <text x="825" y="62" font-size="22" font-weight="bold">Report</text>
    <text x="825" y="92" font-size="18">Relationships, issues &amp; scope</text>
  </g>
</svg>
